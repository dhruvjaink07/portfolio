name: CI

on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same build the deploy runs, without deploying; needs no Cloudflare secrets.
      - run: npx opennextjs-cloudflare build
      - run: npm run typecheck
